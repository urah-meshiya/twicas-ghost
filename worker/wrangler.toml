name = "twicas-ghost-worker"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "WATCHER"
class_name = "TwicasWatcher"

[[migrations]]
tag = "v1"
new_classes = ["TwicasWatcher"]

